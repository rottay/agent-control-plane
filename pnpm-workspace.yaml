packages:
  - "packages/*/*"

# P0 law: no package may execute install-time scripts. The allow-list stays
# empty unless the owner authorises a named exception.
#
# P1A exception, adjudicated by the DT and asserted by
# scripts/check-architecture.mjs: better-sqlite3 is the ledger engine and is the
# only native module in the graph. The published 13.0.3 tarball ships prebuilt
# binaries and declares no install script, so this entry authorises a source
# build only as a fallback on a platform without a prebuild. No second name may
# be added here without a new owner authorisation.
#
# P1B adds the browser toolchain (Vite, Rolldown, React) and adds NOTHING here.
# That was verified rather than assumed: no package in the added graph declares
# a preinstall, install or postinstall script, so the allow-list stays exactly
# one name long.
#
# P2A adds the Restate TypeScript SDK and adds NOTHING here either. The SDK's
# whole graph is itself plus @restatedev/restate-sdk-core, neither of which
# declares an install script. The Restate SERVER is deliberately absent: the
# @restatedev/restate-server npm package depends on @scarf/scarf, whose
# postinstall is a network beacon. The 1.7.7 server is acquired as an external
# pinned binary under the ignored .acp-local/tools/ by an explicit operator
# command with platform and SHA-256 verification, never by an install hook.
#
# P8-8B adds the UI foundation's two runtime dependencies — @tanstack/react-query
# and @radix-ui/react-navigation-menu — and adds NOTHING here. Verified rather
# than assumed, the same way P1B and P2A were: every package the two pull into
# the graph was read out of the lockfile and none declares a preinstall,
# install or postinstall script, so the allow-list stays exactly one name long.
#
# P8-8C adds one primitive, @radix-ui/react-dropdown-menu (the initiative
# switcher), and adds NOTHING here either, verified the same way: every package
# its graph pulls in was read out of the lockfile and none declares a
# preinstall, install or postinstall script.
#
# P8-8D adds one more, @radix-ui/react-dialog (the roadmap edit dialog, C6),
# and adds NOTHING here either, verified the same way: every package its
# graph pulls in — new or already shared with the dropdown menu's own — was
# read out of the lockfile and none declares a preinstall, install or
# postinstall script.
#
# P8-8E adds @xyflow/react (the task graph's canvas) and its own graph —
# including the d3-family modules it rides in on (d3-drag, d3-selection,
# d3-zoom and their shared d3-dispatch/d3-ease/d3-interpolate/d3-timer
# dependencies) — and adds NOTHING here either, verified the same way: every
# package the whole added graph pulls in was read out of the lockfile and,
# for each, its installed `node_modules/.pnpm/*/node_modules/*/package.json`
# `scripts` field was read directly and none declares a preinstall, install
# or postinstall script.
onlyBuiltDependencies:
  - better-sqlite3

# Single source of truth for shared runtime dependency versions.
catalog:
  zod: 4.1.13
  better-sqlite3: 13.0.3
  fastify: 5.12.1
  "@types/better-sqlite3": 9.6.0
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  vite: 8.2.2
  "@vitejs/plugin-react": 6.1.0
  "@restatedev/restate-sdk": 1.16.9
  # P8-8B: the UI foundation. Pinned exactly, like every entry above — a range
  # here would let a rendering or cache-semantics change arrive unreviewed.
  "@tanstack/react-query": 5.102.8
  "@radix-ui/react-navigation-menu": 1.2.22
  # P8-8C: the initiative switcher's one adjudicated primitive.
  "@radix-ui/react-dropdown-menu": 2.1.24
  # P8-8D: the roadmap edit dialog's one adjudicated primitive (C6).
  "@radix-ui/react-dialog": 1.1.23
  # P8-8E: the task graph's canvas (C6).
  "@xyflow/react": 12.11.5
  # P8-9-2: the live-DOM evidence battery's two test-scope tools, pinned
  # exactly like every entry above. Both are devDependencies of @acp/ui only
  # and reach no shipped bundle: jsdom is the DOM the docblock-scoped suites
  # run in, axe-core the accessibility engine they assert with.
  #
  # jsdom is pinned at 29.1.1, not the newer 30.x, and the reason is this
  # repository's own Node pin rather than caution: `.nvmrc` says 22.17.0 and
  # the root manifest declares `>=22.17.0 <23`, while jsdom 30 requires
  # `^22.22.2` on the 22 line. Taking 30 would raise the floor this repository
  # states it runs on, which is a deliberate decision and not a side effect of
  # installing a test tool. 29.1.1 asks for `^22.13.0` and is the newest
  # release the declared floor satisfies.
  jsdom: 29.1.1
  axe-core: 4.13.0
