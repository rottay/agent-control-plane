<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Agent Control Plane: Run the team. Keep the control.</title><defs><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09151d"/><stop offset="1" stop-color="#173b42"/></linearGradient><filter id="lift" x="-10%" y="-15%" width="125%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1821" flood-opacity=".13"/></filter></defs>
<rect x=".5" y=".5" width="1199" height="519" rx="24" fill="url(#bg)" stroke="#38515d"/>
<text x="52" y="58" fill="#f8fafc" font-size="27" font-weight="750" letter-spacing="-1.2">rottay</text>
<path d="M151 34 V67" stroke="#54707b"/>
<text x="177" y="55" fill="#d5e0e5" font-size="13" class="mono" letter-spacing="2">AGENT CONTROL PLANE</text>
<rect x="52" y="105" width="354" height="30" rx="6" fill="#baff75"/>
<text x="65" y="125" fill="#0a1b1b" font-size="12" font-weight="700" letter-spacing="1.2">YOUR WORKFLOW. NOT YOUR VENDOR'S.</text>
<text x="48" y="211" fill="#ffffff" font-size="78" font-weight="750" letter-spacing="-3.8">Run the team.</text>
<text x="48" y="299" fill="#baff75" font-size="78" font-weight="750" letter-spacing="-3.8">Keep the control.</text>
<text x="54" y="353" fill="#f0f5f8" font-size="25">Different models. Clear responsibilities.</text>
<text x="54" y="390" fill="#f0f5f8" font-size="25">One workflow you own.</text>
<rect x="846" y="134" width="300" height="269" rx="16" fill="#112832" stroke="#47616e" filter="url(#lift)"/>
<text x="872" y="172" fill="#baff75" font-size="11" class="mono" letter-spacing="1.6">YOU DEFINE THE RULES</text>
<path d="M872 190 H1120" stroke="#3b5661"/>
<text x="872" y="226" fill="#ffffff" font-size="23" font-weight="600">Who does the work.</text>
<text x="872" y="276" fill="#ffffff" font-size="23" font-weight="600">What they can do.</text>
<text x="872" y="326" fill="#ffffff" font-size="23" font-weight="600">When it can advance.</text>
<rect x="872" y="353" width="248" height="27" rx="5" fill="#234c4d"/>
<text x="996" y="372" fill="#d6f3e2" font-size="12" text-anchor="middle">Models are choices. Not dependencies.</text>
<path d="M52 441 H1148" stroke="#46606b"/>
<text x="54" y="479" fill="#d1e0e7" font-size="13" class="mono" letter-spacing="1.2">SUBSCRIPTION-AWARE</text>
<text x="480" y="479" fill="#d1e0e7" font-size="13" class="mono" letter-spacing="1.2">LOCAL-FIRST</text>
<text x="1146" y="479" fill="#baff75" font-size="13" class="mono" letter-spacing="1.2" text-anchor="end">PROVIDER-NEUTRAL</text>
</svg>
