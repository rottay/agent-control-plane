<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="title"><title id="title">Use the capacity you already pay for. Subscriptions, API keys and local models share a contract, not a billing model.</title><defs><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09151d"/><stop offset="1" stop-color="#173b42"/></linearGradient><filter id="lift" x="-10%" y="-15%" width="125%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1821" flood-opacity=".13"/></filter></defs>
<rect x=".5" y=".5" width="1199" height="455" rx="24" fill="url(#bg)" stroke="#38515d"/>
<text x="46" y="48" fill="#baff75" font-size="12" class="mono" letter-spacing="1.5">SUBSCRIPTIONS ARE PART OF THE EXECUTION STRATEGY</text>
<text x="43" y="108" fill="#ffffff" font-size="47" font-weight="750" letter-spacing="-1.6">Use the capacity you already pay for.</text>
<text x="46" y="149" fill="#d0e0e9" font-size="21">One task model. Different ways to run it. Explicit rules for every choice.</text>
<rect x="42" y="196" width="362" height="155" rx="13" fill="#baff75" stroke="#baff75" filter="url(#lift)"/>
<text x="65" y="235" fill="#173719" font-size="13" class="mono" font-weight="700" letter-spacing="1.1">SUBSCRIPTIONS</text>
<text x="65" y="278" fill="#0a1d17" font-size="22" font-weight="650">Your permitted coding tools.</text>
<text x="65" y="313" fill="#23422e" font-size="18">Quota, eligibility and resets.</text><rect x="420" y="196" width="362" height="155" rx="13" fill="#142f3c" stroke="#547382" filter="url(#lift)"/>
<text x="443" y="235" fill="#baff75" font-size="13" class="mono" font-weight="700" letter-spacing="1.1">API KEYS</text>
<text x="443" y="278" fill="#ffffff" font-size="22" font-weight="650">Explicit metered access.</text>
<text x="443" y="313" fill="#d4e3eb" font-size="18">Budgets and authorized spend.</text><rect x="798" y="196" width="362" height="155" rx="13" fill="#142f3c" stroke="#547382" filter="url(#lift)"/>
<text x="821" y="235" fill="#baff75" font-size="13" class="mono" font-weight="700" letter-spacing="1.1">LOCAL MODELS</text>
<text x="821" y="278" fill="#ffffff" font-size="22" font-weight="650">Your admitted endpoints.</text>
<text x="821" y="313" fill="#d4e3eb" font-size="18">Resources and privacy scope.</text>
<text x="600" y="400" fill="#ffffff" font-size="21" text-anchor="middle" font-weight="600">Shared execution contract. Separate billing and permission rules.</text>
<text x="600" y="431" fill="#c8dae5" font-size="14" text-anchor="middle">Target experience · Provider terms apply · No silent fallback to a paid API bill</text>
</svg>
