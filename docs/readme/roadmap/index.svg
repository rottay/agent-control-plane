<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="686" viewBox="0 0 1200 686" role="img" aria-labelledby="title desc">
  <title id="title">From a useful task to a dependable product.</title>
  <desc id="desc">Six planned product deliveries, not completion statuses or dates. First useful task; verified recoverable work; continuous execution; coordinated teams; operational intelligence; dependable distribution. Console redesign and optional packs follow separately.</desc>
  <defs>
    <style>text{font-family:"Helvetica Neue",Arial,sans-serif}.serif{font-family:Georgia,serif;font-style:italic}.mono{font-family:Menlo,Consolas,monospace}</style>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="175%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#12232a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="685" rx="20" fill="#142630" stroke="#30444d"/>
  <text x="46" y="43" font-size="12" fill="#b8c6c8" class="mono" letter-spacing="1.4">PRODUCT ROADMAP / DEMONSTRABLE OUTCOMES</text>
  <text x="46" y="103" font-size="43" fill="#f4f1e8" font-weight="600" letter-spacing="-1.6">Useful at each step.</text>
  <text x="455" y="103" font-size="47" fill="#d9e4bd" class="serif" letter-spacing="-1.3">Built to last.</text>
  <rect x="46" y="143" width="528" height="139" rx="13" fill="#21363f" stroke="#3c5157"/>
  <text x="69" y="184" font-size="24" fill="#d9e4bd" class="mono">01</text>
  <text x="123" y="184" font-size="24" fill="#f4f1e9" font-weight="550" letter-spacing="-0.7">First useful task</text>
  <text x="123" y="220" font-size="16" fill="#becbcf">Send instructions through CLI or API.</text>
  <text x="123" y="247" font-size="16" fill="#becbcf">Run a model. Retrieve a real result.</text>
  <rect x="626" y="143" width="528" height="139" rx="13" fill="#21363f" stroke="#3c5157"/>
  <text x="649" y="184" font-size="24" fill="#d9e4bd" class="mono">02</text>
  <text x="703" y="184" font-size="24" fill="#f4f1e9" font-weight="550" letter-spacing="-0.7">Verified, recoverable work</text>
  <text x="703" y="220" font-size="16" fill="#becbcf">Independent checks and authorized commits.</text>
  <text x="703" y="247" font-size="16" fill="#becbcf">Recover without blindly repeating effects.</text>
  <rect x="46" y="301" width="528" height="139" rx="13" fill="#21363f" stroke="#3c5157"/>
  <text x="69" y="342" font-size="24" fill="#d9e4bd" class="mono">03</text>
  <text x="123" y="342" font-size="24" fill="#f4f1e9" font-weight="550" letter-spacing="-0.7">Continuous execution</text>
  <text x="123" y="378" font-size="16" fill="#becbcf">Quotas, resets and safe account handoffs.</text>
  <text x="123" y="405" font-size="16" fill="#becbcf">Durable queues, cancellation and timers.</text>
  <rect x="626" y="301" width="528" height="139" rx="13" fill="#21363f" stroke="#3c5157"/>
  <text x="649" y="342" font-size="24" fill="#d9e4bd" class="mono">04</text>
  <text x="703" y="342" font-size="24" fill="#f4f1e9" font-weight="550" letter-spacing="-0.7">Coordinated agent teams</text>
  <text x="703" y="378" font-size="16" fill="#becbcf">Plans, dependencies and configurable roles.</text>
  <text x="703" y="405" font-size="16" fill="#becbcf">Isolated parallel work and bounded tools.</text>
  <rect x="46" y="459" width="528" height="139" rx="13" fill="#21363f" stroke="#3c5157"/>
  <text x="69" y="500" font-size="24" fill="#d9e4bd" class="mono">05</text>
  <text x="123" y="500" font-size="24" fill="#f4f1e9" font-weight="550" letter-spacing="-0.7">Operational intelligence</text>
  <text x="123" y="536" font-size="16" fill="#becbcf">Trace progress, usage and cost per result.</text>
  <text x="123" y="563" font-size="16" fill="#becbcf">Evaluate models. Improve routing policies.</text>
  <rect x="626" y="459" width="528" height="139" rx="13" fill="#21363f" stroke="#3c5157"/>
  <text x="649" y="500" font-size="24" fill="#d9e4bd" class="mono">06</text>
  <text x="703" y="500" font-size="24" fill="#f4f1e9" font-weight="550" letter-spacing="-0.7">A dependable product</text>
  <text x="703" y="536" font-size="16" fill="#becbcf">Portable boundaries. Verified profiles.</text>
  <text x="703" y="563" font-size="16" fill="#becbcf">Installation, documentation and certification.</text>
  <path d="M46 624 L1154 624" fill="none" stroke="#3e5156" stroke-width="1"/>
  <text x="46" y="657" font-size="10" fill="#bfcccc" class="mono" letter-spacing="1">PLANNED DELIVERIES &#x2014; NOT COMPLETION BADGES</text>
  <text x="1154" y="657" font-size="15" fill="#bfcccc" text-anchor="end">Console redesign and optional packs follow separately.</text>
</svg>
