<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="title desc">
  <title id="title">Keep the work. Change the implementation.</title>
  <desc id="desc">Task identity, context, permissions and history live behind shared contracts. Compatible adapters supply models, durability, tools and telemetry. One owner per responsibility and tested compatibility govern replacement.</desc>
  <defs>
    <style>text{font-family:"Helvetica Neue",Arial,sans-serif}.serif{font-family:Georgia,serif;font-style:italic}.mono{font-family:Menlo,Consolas,monospace}</style>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="175%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#12232a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="663" rx="20" fill="#f3f0e9" stroke="#d8d6cc"/>
  <text x="46" y="44" font-size="12" fill="#53616a" class="mono" letter-spacing="1.4">THE ARCHITECTURE / REPLACEABLE EDGES</text>
  <text x="46" y="102" font-size="43" fill="#192630" font-weight="650" letter-spacing="-1.7">Keep the work.</text>
  <text x="351" y="102" font-size="43" fill="#355945" class="serif" letter-spacing="-1.1">Change the implementation.</text>
  <rect x="46" y="142" width="1108" height="159" rx="15" fill="#142630" stroke="none"/>
  <text x="75" y="179" font-size="11" fill="#bdccce" class="mono" letter-spacing="1.4">WHAT BELONGS TO YOUR WORKFLOW</text>
  <text x="75" y="227" font-size="29" fill="#f4f1e8" font-weight="550" letter-spacing="-0.3">Goals  /  Context  /  Permissions  /  Evidence</text>
  <text x="75" y="269" font-size="18" fill="#bdccce">Shared contracts keep task identity, budgets and recorded history independent of vendor protocols.</text>
