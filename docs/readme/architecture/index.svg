  <rect x="46" y="369" width="268" height="199" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="64" y="400" font-size="10" fill="#537057" class="mono" letter-spacing="1.4">MODELS</text>
  <text x="64" y="438" font-size="18" fill="#192630" font-weight="600" letter-spacing="-0.3">The right intelligence</text>
  <text x="64" y="471" font-size="14" fill="#53616a">Claude Code &#xB7; Codex &#xB7; Kimi</text>
  <text x="64" y="496" font-size="14" fill="#53616a">API-key clients &#xB7; Local models</text>
  <path d="M64 518 L294 518" fill="none" stroke="#d8d6cc" stroke-width="1"/>
  <text x="64" y="547" font-size="13" fill="#56725b" font-weight="550">Execution contract</text>
  <rect x="326" y="369" width="268" height="199" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="344" y="400" font-size="10" fill="#537057" class="mono" letter-spacing="1.4">DURABILITY</text>
  <text x="344" y="438" font-size="18" fill="#192630" font-weight="600" letter-spacing="-0.3">Work that can recover</text>
  <text x="344" y="471" font-size="14" fill="#53616a">SQLite &#xB7; Restate</text>
  <text x="344" y="496" font-size="14" fill="#53616a">Other certified drivers</text>
  <path d="M344 518 L574 518" fill="none" stroke="#d8d6cc" stroke-width="1"/>
  <text x="344" y="547" font-size="13" fill="#56725b" font-weight="550">Orchestration contract</text>
  <rect x="606" y="369" width="268" height="199" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="624" y="400" font-size="10" fill="#537057" class="mono" letter-spacing="1.4">TOOLS</text>
  <text x="624" y="438" font-size="18" fill="#192630" font-weight="600" letter-spacing="-0.3">Capabilities on demand</text>
  <text x="624" y="471" font-size="14" fill="#53616a">Native tools &#xB7; MCP</text>
  <text x="624" y="496" font-size="14" fill="#53616a">Bounded external harnesses</text>
  <path d="M624 518 L854 518" fill="none" stroke="#d8d6cc" stroke-width="1"/>
  <text x="624" y="547" font-size="13" fill="#56725b" font-weight="550">Tool &amp; harness contracts</text>
  <rect x="886" y="369" width="268" height="199" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="904" y="400" font-size="10" fill="#537057" class="mono" letter-spacing="1.4">OBSERVABILITY</text>
  <text x="904" y="438" font-size="18" fill="#192630" font-weight="600" letter-spacing="-0.3">Visibility without control</text>
  <text x="904" y="471" font-size="14" fill="#53616a">OTLP &#xB7; Phoenix</text>
  <text x="904" y="496" font-size="14" fill="#53616a">Other compatible collectors</text>
  <path d="M904 518 L1134 518" fill="none" stroke="#d8d6cc" stroke-width="1"/>
  <text x="904" y="547" font-size="13" fill="#56725b" font-weight="550">Telemetry contract</text>
  <text x="600" y="615" font-size="12" fill="#53616a" class="mono" text-anchor="middle" letter-spacing="1.1">ONE OWNER PER RESPONSIBILITY &#xB7; COMPATIBILITY BEFORE EXECUTION</text>
  <text x="600" y="641" font-size="14" fill="#53616a" text-anchor="middle">Design concept. Named alternatives require an implemented, tested adapter before selection.</text>
