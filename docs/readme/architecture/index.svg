<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">Assign the responsibility. Define what happens next.</title>
  <desc id="desc">Illustrative configurable workflow: Kimi clarifies requirements, Claude implements, a selected worker tests, and Codex reviews. Review may request clarification, code changes or more tests, or permit an authorized next step. These are examples, not fixed brand assignments. Agents produce results; the backend validates transitions.</desc>
  <defs>
    <style>text{font-family:"Helvetica Neue",Arial,sans-serif}.serif{font-family:Georgia,serif;font-style:italic}.mono{font-family:Menlo,Consolas,monospace}</style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718879" stroke-width="1.4"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1199" height="769" rx="20" fill="#f3f0e9" stroke="#d8d6cc"/>
  <text x="46" y="45" font-size="12" fill="#53616a" class="mono" letter-spacing="1.4">YOUR WORKFLOW / YOUR CONDITIONS</text>
  <text x="46" y="102" font-size="40" fill="#192630" font-weight="650" letter-spacing="-1.4">Assign the responsibility.</text>
  <text x="46" y="153" font-size="40" fill="#355945" class="serif" letter-spacing="-1">Define what happens next.</text>
  <rect x="46" y="183" width="1108" height="61" rx="11" fill="#142630"/>
  <text x="70" y="208" font-size="10" fill="#bccccc" class="mono" letter-spacing="1.3">EVERY STEP HAS A CONTRACT</text>
  <text x="70" y="231" font-size="16" fill="#f3f0e9">Role + model + context + permissions + deliverable + exit conditions</text>

  <rect x="46" y="276" width="254" height="166" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="65" y="303" font-size="10" fill="#537057" class="mono" letter-spacing="1">01 / CLARIFY</text>
  <text x="65" y="338" font-size="23" fill="#192630" font-weight="600">Requirements</text>
  <text x="65" y="365" font-size="16" fill="#53616a">Kimi · example assignment</text>
  <path d="M65 384 H281" stroke="#d8d6cc"/>
  <text x="65" y="409" font-size="14" fill="#53616a">Deliver: an approved brief</text>

  <path d="M306 358 H326" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="276" width="254" height="166" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="349" y="303" font-size="10" fill="#537057" class="mono" letter-spacing="1">02 / IMPLEMENT</text>
  <text x="349" y="338" font-size="23" fill="#192630" font-weight="600">Implementation</text>
  <text x="349" y="365" font-size="16" fill="#53616a">Claude · example assignment</text>
  <path d="M349 384 H565" stroke="#d8d6cc"/>
  <text x="349" y="409" font-size="14" fill="#53616a">Deliver: a bounded change</text>

  <path d="M590 358 H610" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="614" y="276" width="254" height="166" rx="13" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="633" y="303" font-size="10" fill="#537057" class="mono" letter-spacing="1">03 / VERIFY</text>
  <text x="633" y="338" font-size="23" fill="#192630" font-weight="600">Tests &amp; evidence</text>
  <text x="633" y="365" font-size="16" fill="#53616a">Your selected worker</text>
  <path d="M633 384 H849" stroke="#d8d6cc"/>
  <text x="633" y="409" font-size="14" fill="#53616a">Deliver: measured checks</text>

  <path d="M874 358 H894" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="898" y="276" width="256" height="166" rx="13" fill="#e4ebd7" stroke="#b8c5a5"/>
  <text x="917" y="303" font-size="10" fill="#537057" class="mono" letter-spacing="1">04 / REVIEW</text>
  <text x="917" y="338" font-size="23" fill="#192630" font-weight="600">Independent audit</text>
  <text x="917" y="365" font-size="16" fill="#53616a">Codex · example assignment</text>
  <path d="M917 384 H1135" stroke="#becbb1"/>
  <text x="917" y="409" font-size="14" fill="#53616a">Deliver: findings + verdict</text>

  <text x="46" y="478" font-size="11" fill="#53616a" class="mono" letter-spacing="1.2">THE RESULT SELECTS AN AUTHORIZED PATH</text>
  <path d="M1026 442 V503 H173" fill="none" stroke="#718879" stroke-width="2"/>
  <path d="M173 503 V531" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M457 503 V531" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M741 503 V531" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1026 503 V531" fill="none" stroke="#718879" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="46" y="541" width="254" height="110" rx="11" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="65" y="569" font-size="11" fill="#786149" class="mono">NEEDS CLARIFICATION</text>
  <text x="65" y="599" font-size="21" fill="#192630" font-weight="600">Back to requirements</text>
  <text x="65" y="628" font-size="14" fill="#53616a">Resolve the missing decision</text>

  <rect x="330" y="541" width="254" height="110" rx="11" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="349" y="569" font-size="11" fill="#786149" class="mono">CHANGES REQUESTED</text>
  <text x="349" y="599" font-size="21" fill="#192630" font-weight="600">Back to implementation</text>
  <text x="349" y="628" font-size="14" fill="#53616a">Correct the reported defect</text>

  <rect x="614" y="541" width="254" height="110" rx="11" fill="#fffcf6" stroke="#cfd3c7"/>
  <text x="633" y="569" font-size="11" fill="#786149" class="mono">EVIDENCE INCOMPLETE</text>
  <text x="633" y="599" font-size="21" fill="#192630" font-weight="600">Back to testing</text>
  <text x="633" y="628" font-size="14" fill="#53616a">Add the missing checks</text>

  <rect x="898" y="541" width="256" height="110" rx="11" fill="#142630"/>
  <text x="917" y="569" font-size="11" fill="#d9e4bd" class="mono">ACCEPTED + GATES PASSED</text>
  <text x="917" y="599" font-size="21" fill="#f3f0e9" font-weight="600">Authorized next step</text>
  <text x="917" y="628" font-size="14" fill="#bdccce">Advance within the policy</text>

  <path d="M46 682 H1154" stroke="#d8d6cc"/>
  <text x="600" y="716" text-anchor="middle" font-size="20" fill="#192630" font-weight="550">Agents produce results. The backend validates transitions.</text>
  <text x="600" y="745" text-anchor="middle" font-size="13" fill="#53616a">Illustrative configuration · Assignments are replaceable · Correction loops are bounded</text>
</svg>
