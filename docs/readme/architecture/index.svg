<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title"><title id="title">Configure every responsibility and every transition. Agents produce results; the backend validates advancement.</title><defs><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09151d"/><stop offset="1" stop-color="#173b42"/></linearGradient><filter id="lift" x="-10%" y="-15%" width="125%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1821" flood-opacity=".13"/></filter></defs>
<rect x=".5" y=".5" width="1199" height="687" rx="24" fill="#f4f7fa" stroke="#c6d0da"/>
<rect x="26" y="26" width="1148" height="149" rx="16" fill="#0d1d27"/>
<text x="54" y="63" fill="#baff75" font-size="12" class="mono" letter-spacing="1.6">CONFIGURABLE ROLES / CONDITIONAL TRANSITIONS</text>
<text x="52" y="119" fill="#ffffff" font-size="42" font-weight="700" letter-spacing="-1.6">Every step has a role. Every result has a rule.</text>
<text x="54" y="152" fill="#d0dce5" font-size="17">Choose the provider, model, context, permissions and acceptance criteria for each responsibility.</text>
<rect x="38" y="210" width="266" height="205" rx="13" fill="#ffffff" stroke="#c6d0da" filter="url(#lift)"/>
<text x="58" y="249" fill="#536879" class="mono" font-size="22">01</text>
<text x="58" y="295" fill="#0c1c28" font-size="31" font-weight="700" letter-spacing="-1">Plan</text>
<text x="58" y="327" fill="#344c5e" font-size="16">Clarify the requirements.</text>
<path d="M58 348 H284" stroke="#ced8df"/>
<text x="58" y="379" fill="#344c5e" font-size="16">An approved brief.</text>
<path d="M308 306 h11 m-4 -4 l4 4 -4 4" fill="none" stroke="#425f70" stroke-width="2"/><rect x="324" y="210" width="266" height="205" rx="13" fill="#ffffff" stroke="#c6d0da" filter="url(#lift)"/>
<text x="344" y="249" fill="#536879" class="mono" font-size="22">02</text>
<text x="344" y="295" fill="#0c1c28" font-size="31" font-weight="700" letter-spacing="-1">Implement</text>
<text x="344" y="327" fill="#344c5e" font-size="16">Create the bounded change.</text>
<path d="M344 348 H570" stroke="#ced8df"/>
<text x="344" y="379" fill="#344c5e" font-size="16">Code and artifacts.</text>
<path d="M594 306 h11 m-4 -4 l4 4 -4 4" fill="none" stroke="#425f70" stroke-width="2"/><rect x="610" y="210" width="266" height="205" rx="13" fill="#ffffff" stroke="#c6d0da" filter="url(#lift)"/>
<text x="630" y="249" fill="#536879" class="mono" font-size="22">03</text>
<text x="630" y="295" fill="#0c1c28" font-size="31" font-weight="700" letter-spacing="-1">Verify</text>
<text x="630" y="327" fill="#344c5e" font-size="16">Run independent checks.</text>
<path d="M630 348 H856" stroke="#ced8df"/>
<text x="630" y="379" fill="#344c5e" font-size="16">Measured evidence.</text>
<path d="M880 306 h11 m-4 -4 l4 4 -4 4" fill="none" stroke="#425f70" stroke-width="2"/><rect x="896" y="210" width="266" height="205" rx="13" fill="#e4f9cf" stroke="#9aba7b" filter="url(#lift)"/>
<text x="916" y="249" fill="#32521d" class="mono" font-size="22">04</text>
<text x="916" y="295" fill="#0c1c28" font-size="31" font-weight="700" letter-spacing="-1">Review</text>
<text x="916" y="327" fill="#344c5e" font-size="16">Evaluate the whole result.</text>
<path d="M916 348 H1142" stroke="#ced8df"/>
<text x="916" y="379" fill="#344c5e" font-size="16">A reasoned verdict.</text>

<text x="40" y="464" fill="#233d4c" font-size="12" class="mono" letter-spacing="1.3">THE VERDICT CHANGES THE PATH — NOT THE RULES</text>
<rect x="38" y="491" width="266" height="91" rx="11" fill="#e7edf2" stroke="#c6d0da"/><text x="55" y="519" fill="#4d6373" font-size="11" class="mono">CLARIFICATION</text><text x="55" y="552" fill="#102333" font-size="18" font-weight="650">Return to planning</text><rect x="324" y="491" width="266" height="91" rx="11" fill="#e7edf2" stroke="#c6d0da"/><text x="341" y="519" fill="#4d6373" font-size="11" class="mono">CHANGES REQUIRED</text><text x="341" y="552" fill="#102333" font-size="18" font-weight="650">Return to implementation</text><rect x="610" y="491" width="266" height="91" rx="11" fill="#e7edf2" stroke="#c6d0da"/><text x="627" y="519" fill="#4d6373" font-size="11" class="mono">EVIDENCE MISSING</text><text x="627" y="552" fill="#102333" font-size="18" font-weight="650">Return to verification</text><rect x="896" y="491" width="266" height="91" rx="11" fill="#0d1d27" stroke="#0d1d27"/><text x="913" y="519" fill="#baff75" font-size="11" class="mono">ALL GATES PASSED</text><text x="913" y="552" fill="#ffffff" font-size="18" font-weight="650">Allow the next step</text>
<text x="600" y="633" fill="#0b1d29" font-size="25" font-weight="700" text-anchor="middle">No advancement without the required evidence.</text>
<text x="600" y="662" fill="#41596b" font-size="14" text-anchor="middle">Illustrative workflow · Replaceable assignments · Bounded correction loops</text>
</svg>
