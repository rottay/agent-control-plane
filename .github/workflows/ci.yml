name: ci

# This workflow was frozen in P0 as a contract, for the case the owner ever
# published the repository. That happened on 2026-09-03, so this contract is
# now live rather than hypothetical: CI runs exactly the same gate a local
# writer runs, and nothing here may diverge from `pnpm check`.
#
# It grants no publication authority of its own. Pushing is governed by
# `.githooks/pre-push`, which denies by default and is a local hook CI does not
# execute; this workflow only ever reads and checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep installs deterministic and quiet.
  CI: "true"
  PNPM_HOME: ${{ github.workspace }}/.pnpm-home

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Report toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Arm the mechanical Git fence
        run: git config core.hooksPath .githooks

      - name: Check
        run: pnpm check
